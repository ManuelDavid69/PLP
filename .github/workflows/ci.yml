name: C CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and test (GCC, C11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          gcc --version | head -n 1
          make --version | head -n 1

      - name: Build all practicals
        run: make all

      - name: Run unit and golden tests
        run: make test

      - name: Strict build (warnings are errors)
        run: |
          make clean
          make all CFLAGS='-std=c11 -Wall -Wextra -Wpedantic -O2 -Werror'
